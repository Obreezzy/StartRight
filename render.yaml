# Render Blueprint for the StartRight chat site (free plan).
# Secrets (sync: false) are typed into the Render dashboard, never committed.
services:
  - type: web
    name: startright
    runtime: docker
    dockerfilePath: ./Dockerfile.web
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ACCESS_CODE
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: RETRIEVAL_MODE
        value: bm25_light
      - key: LEXICAL_MIN_SCORE
        value: "0.3"
      - key: RATE_LIMIT_PER_HOUR
        value: "15"
      - key: DAILY_TOKEN_BUDGET
        value: "60000"
